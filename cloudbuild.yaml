# Cloud Build configuration for Waymark
# Triggers: push to main branch
# Usage: gcloud builds submit --config=cloudbuild.yaml .

steps:
  # ─── BACKEND ─────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/waymark/backend:$COMMIT_SHA',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/waymark/backend:latest',
      './backend'
    ]
    dir: '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/waymark/backend:$COMMIT_SHA']
    waitFor: ['build-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'waymark-backend',
      '--image=us-central1-docker.pkg.dev/$PROJECT_ID/waymark/backend:$COMMIT_SHA',
      '--platform=managed',
      '--region=us-central1',
      '--allow-unauthenticated',
      '--port=8000',
      '--memory=512Mi',
      '--cpu=1',
      '--min-instances=0',
      '--max-instances=10',
      '--set-env-vars=APP_ENV=production',
      '--set-env-vars=HTTP_USER_AGENT=Waymark/1.0 ($$EMAIL)',
      '--set-env-vars=SUPABASE_URL=https://$$SUPABASE_PROJECT.supabase.co',
      '--set-env-vars=SUPABASE_ANON_KEY=$$SUPABASE_ANON_KEY',
      '--set-env-vars=SUPABASE_SERVICE_ROLE_KEY=$$SUPABASE_SERVICE_ROLE_KEY',
      '--set-env-vars=SUPABASE_JWT_SECRET=$$SUPABASE_JWT_SECRET',
      '--set-env-vars=CORS_ORIGINS=https://waymark-frontend-$$PROJECT_NUMBER.uc.a.run.app'
    ]
    waitFor: ['push-backend']
    secretEnv: ['EMAIL', 'SUPABASE_PROJECT', 'SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_JWT_SECRET']

  # ─── FRONTEND ────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/waymark/frontend:$COMMIT_SHA',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/waymark/frontend:latest',
      '--build-arg', 'VITE_API_BASE_URL=https://waymark-backend-$$PROJECT_NUMBER.uc.a.run.app/api/v1',
      '--build-arg', 'VITE_SUPABASE_URL=https://$$SUPABASE_PROJECT.supabase.co',
      '--build-arg', 'VITE_SUPABASE_ANON_KEY=$$SUPABASE_ANON_KEY',
      '--build-arg', 'VITE_MAPTILER_API_KEY=$$MAPTILER_API_KEY',
      './frontend'
    ]
    dir: '.'
    secretEnv: ['SUPABASE_PROJECT', 'SUPABASE_ANON_KEY', 'MAPTILER_API_KEY']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/waymark/frontend:$COMMIT_SHA']
    waitFor: ['build-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'waymark-frontend',
      '--image=us-central1-docker.pkg.dev/$PROJECT_ID/waymark/frontend:$COMMIT_SHA',
      '--platform=managed',
      '--region=us-central1',
      '--allow-unauthenticated',
      '--port=8080',
      '--memory=256Mi',
      '--cpu=1',
      '--min-instances=0',
      '--max-instances=10'
    ]
    waitFor: ['push-frontend']

  # ─── UPDATE CORS AFTER FRONTEND DEPLOYS ─────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'update-cors'
    entrypoint: 'bash'
    args: [
      '-c',
      'FRONTEND_URL=$(gcloud run services describe waymark-frontend --region=us-central1 --format="value(status.url)") && gcloud run services update waymark-backend --region=us-central1 --set-env-vars="CORS_ORIGINS=$$FRONTEND_URL"'
    ]
    waitFor: ['deploy-frontend']

# Build timeout
timeout: '1200s'

# Artifact Registry repo must exist: gcloud artifacts repositories create waymark --location=us-central1 --repository-format=docker
# Secrets must be created in Secret Manager:
# gcloud secrets create waymark-email --data-file=-
# gcloud secrets create waymark-supabase-project --data-file=-
# gcloud secrets create waymark-supabase-anon-key --data-file=-
# gcloud secrets create waymark-supabase-service-key --data-file=-
# gcloud secrets create waymark-supabase-jwt-secret --data-file=-
# gcloud secrets create waymark-maptiler-key --data-file=-

# Grant Cloud Build access to secrets:
# gcloud secrets add-iam-policy-binding waymark-email --member=serviceAccount:$(gcloud projects describe $PROJECT_ID --format="value(projectNumber)")@cloudbuild.gserviceaccount.com --role=roles/secretmanager.secretAccessor
# (repeat for each secret)

# Grant Cloud Run invoker to allUsers for public access:
# gcloud run services add-iam-policy-binding waymark-backend --region=us-central1 --member=allUsers --role=roles/run.invoker
# gcloud run services add-iam-policy-binding waymark-frontend --region=us-central1 --member=allUsers --role=roles/run.invoker